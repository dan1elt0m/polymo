name: test
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13' ]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }} && uv python pin ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv venv && uv sync
      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest --junitxml=junit/report.xml
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v6
        if: always() # always run even if the previous step fails
        with:
          report_paths: "junit/report.xml"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc -b --noEmit
      - name: Build frontend
        run: npm run build
      - name: Verify built bundle matches source (bundle parity gate)
        run: git diff --exit-code src/polymo/builder/static/