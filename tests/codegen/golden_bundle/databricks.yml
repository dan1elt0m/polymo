# Databricks Asset Bundle for jsonplaceholder-demo, generated by polymo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for docs.
bundle:
  name: "jsonplaceholder_demo"

resources:
  pipelines:
    jsonplaceholder_demo_pipeline:
      name: "jsonplaceholder_demo_pipeline"
      catalog: "main"
      schema: "raw"
      serverless: true
      # `root_path` is added to `sys.path` when Databricks runs this
      # pipeline's Python sources, which is what makes the `from jsonplaceholder_demo
      # import client, source` in pipelines/posts.py resolve — on the
      # driver only, hence the by-value pickle registration in that file.
      root_path: src
      libraries:
        - glob:
            include: pipelines/posts.py

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
