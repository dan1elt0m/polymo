bundle:
  name: "jsonplaceholder_demo"

artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

resources:
  pipelines:
    jsonplaceholder_demo_pipeline:
      name: "jsonplaceholder_demo_pipeline"
      catalog: "main"
      schema: "raw"
      serverless: true
      root_path: ${workspace.file_path}
      libraries:
        - glob:
            include: pipelines/posts.py
      environment:
        dependencies:
          - ${workspace.root_path}/artifacts/.internal/*.whl

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
