# Databricks Asset Bundle for jsonplaceholder-demo, generated by polymo.
# See https://docs.databricks.com/dev-tools/bundles/index.html for docs.
bundle:
  name: "jsonplaceholder_demo"

# `databricks bundle deploy` builds this wheel (via `uv build --wheel`,
# requires `uv` on the deploy machine — see pyproject.toml) and uploads it
# to the workspace; the pipeline's `environment.dependencies` below then
# installs it, so `src/jsonplaceholder_demo` is importable on the driver AND every
# executor. Requires `serverless: true` on the pipeline resource — a
# classic-cluster pipeline would need the wheel added as a cluster library
# instead.
artifacts:
  default:
    type: whl
    build: uv build --wheel
    path: .

resources:
  pipelines:
    jsonplaceholder_demo_pipeline:
      name: "jsonplaceholder_demo_pipeline"
      catalog: "main"
      schema: "raw"
      serverless: true
      # `root_path` is added to `sys.path` when Databricks runs this
      # pipeline's Python sources, which is what makes the `pipelines/posts.py`
      # glob below resolve; `src/jsonplaceholder_demo` itself is NOT under root_path — it
      # reaches the driver and every executor via the built wheel instead
      # (see `environment.dependencies` below), so `from jsonplaceholder_demo import
      # client, source` in that file just works everywhere.
      root_path: src
      libraries:
        - glob:
            include: pipelines/posts.py
      environment:
        dependencies:
          - ${workspace.root_path}/artifacts/.internal/*.whl

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
