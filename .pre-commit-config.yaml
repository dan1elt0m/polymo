repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff-format
        args:
        - "--config=pyproject.toml"
        exclude: ^tests/codegen/golden/|^tests/codegen/golden_bundle/
      - id: ruff-check
        args:
        - "--fix"
        - "--config=pyproject.toml"
        exclude: ^tests/codegen/golden/|^tests/codegen/golden_bundle/

