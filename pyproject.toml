[project]
name = "polymo"
version = "1.1.0"
description = "Generate standalone Lakeflow Declarative Pipelines scripts from a point-and-click REST connector builder"
readme = "README.md"
authors = [
    { name = "Daniel Tom", email = "d.e.tom89@gmail.com" }
]
requires-python = ">=3.10"
license = { text = "BSD-3" }
keywords = ["spark", "pyspark", "rest", "api", "ingestion", "data-engineering", "etl", "http"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries",
  "Topic :: Database",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = [
    "jinja2>=3.1.6",
    "fastapi>=0.110",
    "uvicorn>=0.24",
    "pyspark>=4",
    "pyarrow>=13",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "httpx>=0.26",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "requests>=2.31",
    "ruff>=0.13.3",
]
docs = [
    "mkdocs>=1.4.2",
    "mkdocs-material>=9.1.4",
    "mkdocs-gen-files>=0.4,<0.6",
    "mkdocs-literate-nav>=0.6.0",
    "mkdocstrings[python]>=0.20,<0.30",
    "mkautodoc>=0.2.0",
    "pymdown-extensions>=10.0.1",
]

[project.scripts]
polymo = "polymo.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Dev-only MSW mock service worker; polymo/builder/static/main.tsx only
# registers it in import.meta.env.DEV builds, so it never runs from the
# packaged production static assets. Keep it out of the wheel.
wheel-exclude = ["polymo/builder/static/mockServiceWorker.js"]

[project.urls]
Homepage = "https://github.com/dan1elt0m/polymo"
Repository = "https://github.com/dan1elt0m/polymo.git"
Documentation = "https://dan1elt0m.github.io/polymo/"
Issues = "https://github.com/dan1elt0m/polymo/issues"

[tool.ruff]
# Golden fixtures capture `generate()`'s literal output byte-for-byte; ruff
# must not reformat them or the golden tests would drift from what the
# generator actually produces.
extend-exclude = ["tests/codegen/golden"]
